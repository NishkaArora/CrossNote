<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Always light: no dark theme, and ask browsers and Dark Reader not to darken the page. -->
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:,">
<title>crossnote explorer</title>
<style>
  /* Palette from the crossnote slides: white, #1675EB, and its tints #F4FAFF / #E7F5FF / #D3EAF8.
     --link is a slightly deeper #1675EB so small blue text and the button label meet WCAG AA. */
  :root {
    color-scheme: only light;
    --bg: #ffffff;
    --surface: #f4faff;
    --raised: #ffffff;
    --ink: #111111;
    --ink-2: #333a45;
    --muted: #5d6877;
    --line: #d3eaf8;
    --brand: #1675eb;
    --link: #1266d0;
    --link-hover: #0f57b3;
    --accent-ink: #ffffff;
    --accent-track: #d3eaf8;
    --tick: #111111;
    --ok: #17703a;
    --ok-bg: #e5f3ea;
    --no: #a8261c;
    --no-bg: #fbe9e7;
    --neutral-bg: #e7f5ff;
    --notice-bg: #e7f5ff;
    --notice-line: #d3eaf8;
    --chosen: #e7f5ff;
    --chosen-line: #1675eb;
    --x: #111111;
    --bsky: #1675eb;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--link); }
  a:hover { color: var(--link-hover); }
  main { max-width: 960px; margin: 0 auto; padding: 28px 16px 64px; }
  header { margin-bottom: 8px; }
  .brand { display: inline-block; font-weight: 800; font-size: 24px; letter-spacing: -.01em; line-height: 1.1; color: var(--ink); text-decoration: none; }
  .brand::after { content: ""; display: block; width: 40px; height: 4px; margin-top: 6px; background: var(--brand); }
  a.brand:hover { color: var(--ink); }
  header h1 { font-size: 26px; line-height: 1.25; margin: 18px 0 6px; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); max-width: 680px; }
  .notice { background: var(--notice-bg); border: 1px solid var(--notice-line); border-radius: 10px; padding: 10px 14px; margin: 18px 0; font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 16px 0; }
  .card > h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
  .pair h3 { font-size: 14px; margin: 0 0 8px; }
  .embed-box { min-height: 80px; overflow-wrap: anywhere; }
  blockquote.bluesky-embed { margin: 0; }
  .note-text { font-size: 17px; line-height: 1.5; white-space: pre-wrap; margin: 0 0 10px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.no { background: var(--no-bg); color: var(--no); }
  .pill.neutral { background: var(--neutral-bg); color: var(--ink-2); }
  .pill.shown { background: var(--link); color: var(--accent-ink); }
  .btn { font: inherit; display: inline-block; padding: 7px 16px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--raised); cursor: pointer; }
  .btn:hover { border-color: var(--brand); }
  .btn.primary { background: var(--link); color: var(--accent-ink); border-color: var(--link); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: var(--link-hover); border-color: var(--link-hover); }
  .btn[aria-pressed="true"] { border-color: var(--brand); background: var(--chosen); font-weight: 600; }
  .btn:disabled { opacity: .55; cursor: default; }
  .lookup { display: flex; gap: 8px; flex-wrap: wrap; }
  .lookup input { flex: 1 1 280px; min-width: 0; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); color: var(--ink); }
  .lookup input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  textarea { width: 100%; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); color: var(--ink); resize: vertical; min-height: 70px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .tile { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tile .value { font-size: 30px; font-weight: 600; line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card.tight { padding: 12px 16px; }
  .card.tight > h2 { margin-bottom: 8px; }
  .tiles.compact { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .tiles.compact:has(> :only-child) { grid-template-columns: minmax(0, 220px); }
  @media (max-width: 640px) { .tiles.compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .compact .tile { padding: 8px 12px; }
  .compact .tile .label { font-size: 12px; }
  .compact .tile .value { font-size: 20px; margin-top: 0; }
  .compact .tile .sub { font-size: 12px; margin-top: 0; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .timeline { list-style: none; margin: 14px 0 0; padding: 0; }
  .timeline li { position: relative; padding: 0 0 14px 24px; }
  .timeline li::before { content: ""; position: absolute; left: 3px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--dot, var(--brand)); box-shadow: 0 0 0 2px var(--surface); }
  .timeline li::after { content: ""; position: absolute; left: 8px; top: 19px; bottom: 0; width: 1px; background: var(--line); }
  .timeline li:last-child::after { display: none; }
  .timeline .what { font-weight: 600; }
  .timeline .where { color: var(--muted); font-weight: 400; }
  .timeline .when { color: var(--muted); font-size: 13px; }
  .timeline .gap { color: var(--ink-2); font-size: 13px; }
  .summary { margin: 12px 0 0; }
  .step { padding: 14px 0; border-top: 1px solid var(--line); }
  .step:first-of-type { border-top: 0; padding-top: 0; }
  .step h3 { font-size: 15px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .step h3 .n { color: var(--muted); font-weight: 600; }
  .step p { margin: 0 0 6px; }
  .meter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; margin: 8px 0 2px; max-width: 560px; }
  .meter .bar { position: relative; height: 8px; border-radius: 999px; background: var(--accent-track); }
  .meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--brand); }
  .meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--tick); border-radius: 1px; }
  .meter .fig { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
  .meter .cap { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .cand { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0 0; }
  .cand.chosen { background: var(--chosen); border-color: var(--chosen-line); }
  .cand .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cand .excerpt { margin: 6px 0 4px; overflow-wrap: anywhere; }
  .cand .why { font-size: 14px; color: var(--ink-2); margin: 0; }
  .rerun-text { min-height: 96px; }
  .rerun-out:not(:empty) { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .rerun-title { font-size: 15px; margin: 0 0 10px; }
  .outcome { font-weight: 600; margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; }
  .outcome.ok { background: var(--ok-bg); color: var(--ok); }
  .outcome.no { background: var(--no-bg); color: var(--no); }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  ol.how { margin: 0; padding-left: 22px; }
  ol.how li { margin: 0 0 8px; }
  ol.how b { font-weight: 600; }
  footer { color: var(--muted); font-size: 13px; margin-top: 28px; }
  footer p { margin: 4px 0; }
  .error { color: var(--no); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<main id="app"><p class="meta">Loading…</p></main>

<script>
// ---- Settings ---------------------------------------------------------------
const CONFIG = {
  // The labeler's Fly app, which serves /demo/match, /demo/summary and
  // /demo/feedback (src/demo-api.ts). Its DEMO_ORIGINS must include this
  // page's origin for feedback to be accepted.
  API_BASE: 'https://crossnote-labeler.fly.dev',
  LABELER_HANDLE: 'crossnote.bsky.social',
  REPO_URL: 'https://github.com/NishkaArora/crossnote_bsky',
  PAPER_URL: 'https://github.com/NishkaArora/crossnote_bsky/blob/main/paper/community-notes-across-platforms.pdf',  // switch to arXiv once posted
  // Stage 1 settings shown on the front page (configs/thresholds.yaml). Post
  // pages use the values the server returns for that match.
  TFIDF_THRESHOLD: 0.1375895433401011,
  EMBEDDING_THRESHOLD: 0.5003167390823364,
  TOP_K: 3,
};
// -----------------------------------------------------------------------------

(function () {
  const app = document.getElementById('app');
  // replaceChildren() would print a skipped (null) section as the text "null".
  const render = (...nodes) => app.replaceChildren(...nodes.filter((n) => n != null && n !== false));
  const params = new URLSearchParams(location.search);
  const EXAMPLE = params.has('example');
  // Local testing only: ?api=http://localhost:8080 points the page at a local labeler.
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(params.get('api') || '')) {
    CONFIG.API_BASE = params.get('api');
  }

  // ---- helpers --------------------------------------------------------------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style') el.setAttribute('style', v);
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false || kid === '') continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const ext = (href, text) => h('a', { href, target: '_blank', rel: 'noopener noreferrer' }, text);
  const toDate = (iso) => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d : null; };
  const fmtTime = (d) => d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const fmt3 = (x) => (typeof x === 'number' ? x.toFixed(3) : '—');
  function fmtDur(ms) {
    if (ms == null || !isFinite(ms)) return '—';
    const mins = Math.round(Math.abs(ms) / 60000);
    if (mins < 1) return 'under a minute';
    if (mins < 60) return `${mins} min`;
    const hours = mins / 60;
    if (hours < 24) { const hr = Math.floor(hours), mi = mins % 60; return mi && hr < 10 ? `${hr} h ${mi} min` : `${Math.round(hours)} h`; }
    const days = hours / 24;
    if (days < 14) { const d = Math.floor(days), hr = Math.round(hours - d * 24); return hr ? `${d} d ${hr} h` : `${d} d`; }
    return `${Math.round(days)} days`;
  }
  const decodeEntities = (s) => String(s || '')
    .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
    .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(parseInt(n, 10)))
    .replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  function linkify(text) {
    const out = []; const re = /https?:\/\/[^\s<>"]*[^\s<>".,;:!?)\]'"]/g;
    let last = 0, m;
    while ((m = re.exec(text))) { out.push(text.slice(last, m.index), ext(m[0], m[0])); last = m.index + m[0].length; }
    out.push(text.slice(last));
    return out;
  }
  const truncate = (s, n) => (s.length > n ? s.slice(0, n).trimEnd() + '…' : s);
  const bskyUrl = (did, rkey) => `https://bsky.app/profile/${did}/post/${rkey}`;
  const bskyUrlFromAt = (uri) => { const m = uri && uri.match(/^at:\/\/([^/]+)\/app\.bsky\.feed\.post\/([^/]+)$/); return m ? bskyUrl(m[1], m[2]) : null; };
  const noteUrl = (id) => `https://x.com/i/birdwatch/n/${encodeURIComponent(id)}`;
  const xPostUrl = (id) => `https://x.com/i/status/${encodeURIComponent(id)}`;
  const postHref = (uri) => `?uri=${encodeURIComponent(uri)}`;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true; s.charset = 'utf-8'; s.onload = resolve; s.onerror = reject;
      document.body.append(s);
    });
  }
  async function getJson(url) {
    const r = await fetch(url, { cache: 'no-store' });
    let body = null; try { body = await r.json(); } catch {}
    return { status: r.status, ok: r.ok, body };
  }

  // ---- input parsing --------------------------------------------------------
  function parsePostInput(raw) {
    const s = raw.trim();
    let m = s.match(/^at:\/\/([^/\s]+)\/app\.bsky\.feed\.post\/([A-Za-z0-9._~:-]+)\/?$/);
    if (m) return { actor: m[1], rkey: m[2] };
    m = s.match(/^(?:https?:\/\/)?(?:www\.)?(?:bsky\.app|deer\.social|blacksky\.community)\/profile\/([^/\s?#]+)\/post\/([A-Za-z0-9._~:-]+)/i);
    if (m) return { actor: decodeURIComponent(m[1]), rkey: m[2] };
    if (/^did:[a-z]+:/i.test(s)) return { error: "That's an account ID (DID), which covers every post by an account. Paste the link to one post instead." };
    if (/^@?[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(s)) return { error: "That's an account handle. Paste the link to one of its posts instead." };
    return { error: 'Paste a Bluesky post link, like https://bsky.app/profile/name.bsky.social/post/3l…' };
  }
  async function resolveActor(actor) {
    if (actor.startsWith('did:')) return actor;
    const u = new URL('https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle');
    u.searchParams.set('handle', actor.replace(/^@/, ''));
    const r = await getJson(u);
    if (!r.ok || !r.body || !r.body.did) throw new Error(`Couldn't find the account @${actor}.`);
    return r.body.did;
  }

  // ---- shared pieces --------------------------------------------------------
  function header(title, sub) {
    return h('header', null,
      h('a', { class: 'brand', href: './' }, 'crossnote'),
      h('h1', null, title),
      sub ? h('p', null, sub) : null);
  }
  function exampleNotice() {
    return EXAMPLE ? h('div', { class: 'notice' },
      h('b', null, 'Example data. '), 'This is a made-up post and note that show what a real result page looks like. ',
      h('a', { href: './' }, 'Look up a real post')) : null;
  }
  function footer(extra) {
    return h('footer', null,
      h('p', null, 'More info: ',
        CONFIG.PAPER_URL ? [ext(CONFIG.PAPER_URL, 'Paper'), ' · '] : null,
        ext(CONFIG.REPO_URL, 'GitHub')),
      extra ? h('p', null, extra) : null);
  }
  function errorCard(title, detail) {
    return h('div', { class: 'card' }, h('p', { class: 'error' }, h('b', null, title)), detail ? h('p', { class: 'meta' }, detail) : null);
  }
  function verdictPill(c) {
    if (c.error) return h('span', { class: 'pill neutral' }, 'Model call failed');
    return c.applicable ? h('span', { class: 'pill ok' }, '✓ Applies') : h('span', { class: 'pill no' }, '✕ Doesn’t apply');
  }
  function tile(label, value, sub, swatch) {
    return h('div', { class: 'tile' },
      h('div', { class: 'label' }, swatch ? h('span', { class: 'swatch', style: `background:${swatch}`, 'aria-hidden': 'true' }) : null, label),
      h('div', { class: 'value' }, value),
      sub ? h('div', { class: 'sub' }, sub) : null);
  }
  // A score on a 0–1 scale, with the threshold it had to reach.
  function meter(name, value, threshold) {
    const pct = (x) => `${Math.max(0, Math.min(1, x)) * 100}%`;
    const passed = typeof value === 'number' && typeof threshold === 'number' ? value >= threshold : null;
    const aria = `${name}: ${fmt3(value)}${typeof threshold === 'number' ? `, threshold ${fmt3(threshold)}${passed ? ', passed' : ''}` : ''}`;
    return h('div', { class: 'meter', role: 'img', 'aria-label': aria, title: aria },
      h('div', { class: 'bar' },
        typeof value === 'number' ? h('div', { class: 'fill', style: `width:${pct(value)}` }) : null,
        typeof threshold === 'number' ? h('div', { class: 'tick', style: `left:${pct(threshold)}` }) : null),
      h('div', { class: 'fig' }, fmt3(value)),
      h('div', { class: 'cap', 'aria-hidden': 'true' },
        typeof threshold === 'number' ? `Needed at least ${fmt3(threshold)} (the black mark). ` : '',
        passed === true ? 'Passed.' : ''));
  }

  // ---- front page -----------------------------------------------------------
  function lookupCard(initial, message) {
    const input = h('input', { type: 'text', name: 'post', id: 'post-input', inputmode: 'url', autocomplete: 'off', spellcheck: 'false',
      placeholder: 'https://bsky.app/profile/…/post/…', value: initial || '', 'aria-describedby': 'lookup-help' });
    const msg = h('p', { class: 'meta error', role: 'status', 'aria-live': 'polite' }, message || '');
    const button = h('button', { class: 'btn primary', type: 'submit' }, 'Look up');
    const form = h('form', {
      class: 'lookup', onsubmit: async (e) => {
        e.preventDefault();
        const parsed = parsePostInput(input.value);
        if (parsed.error) { msg.textContent = parsed.error; return; }
        button.disabled = true; msg.textContent = '';
        try {
          const did = await resolveActor(parsed.actor);
          location.search = postHref(`at://${did}/app.bsky.feed.post/${parsed.rkey}`);
        } catch (err) {
          msg.textContent = err.message || String(err);
          button.disabled = false;
        }
      },
    }, h('label', { class: 'sr-only', for: 'post-input' }, 'Bluesky post link'), input, button);
    return h('section', { class: 'card' },
      h('h2', null, 'Look up a post'),
      form, msg,
      h('p', { class: 'meta', id: 'lookup-help' },
        'On Bluesky: ··· → Copy link to post. Only labeled posts have a page. ',
        h('a', { href: '?example=1' }, 'See an example')));
  }

  // Renders at once and fills in when the numbers arrive, so a slow API never holds up the page.
  function summaryCard() {
    const row = h('div', { class: 'tiles compact' });
    const box = h('section', { class: 'card tight', hidden: true }, h('h2', null, 'So far'), row);
    if (EXAMPLE) return box;
    const profile = new URL('https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile');
    profile.searchParams.set('actor', CONFIG.LABELER_HANDLE);
    Promise.all([
      getJson(`${CONFIG.API_BASE}/demo/summary`).catch(() => ({})),
      getJson(profile).catch(() => ({})),
    ]).then(([summary, prof]) => {
      const b = (summary.ok && summary.body) || {};
      const followers = prof.ok && prof.body ? prof.body.followersCount : null;
      const tiles = [
        b.labeled_posts != null ? tile('Posts labeled', b.labeled_posts.toLocaleString()) : null,
        typeof followers === 'number' ? tile('Followers', followers.toLocaleString()) : null,
        b.median_x_delay_ms != null ? tile('X post → Helpful note', fmtDur(b.median_x_delay_ms), 'median on X') : null,
        b.library && b.library.notes ? tile('Notes in library', b.library.notes.toLocaleString()) : null,
      ].filter(Boolean);
      row.append(...tiles);
      box.hidden = tiles.length === 0;
    });
    return box;
  }

  async function homeView(message) {
    document.title = 'crossnote explorer';
    render(
      header('See why crossnote labeled a post', 'Paste a Bluesky post link to see the Community Note it was matched to and how it was scored.'),
      lookupCard(params.get('post') || '', message),
      summaryCard(),
      footer());
  }

  // ---- result page ----------------------------------------------------------
  function sameClaimCard(d, c) {
    const tweetId = c && (c.tweet_id || (c.note && c.note.tweet_id));
    // Example mode shows made-up text instead of embedding posts that don't exist.
    const exampleBox = (text) => h('div', { class: 'cand' }, h('p', { class: 'excerpt' }, text));
    const bq = EXAMPLE ? exampleBox(d.example_post_text || '')
      : h('blockquote', { class: 'bluesky-embed', 'data-bluesky-uri': d.uri, 'data-bluesky-embed-color-mode': 'light' },
          h('p', null, ext(bskyUrl(d.did, d.rkey), 'View this post on Bluesky')));
    const xBox = h('div', { id: 'x-embed', class: 'embed-box' },
      EXAMPLE ? exampleBox(d.example_x_post_text || '')
      : tweetId ? h('p', { class: 'fallback' }, ext(xPostUrl(tweetId), 'View the X post on X'))
      : h('p', { class: 'meta' }, 'X post not available.'));
    return h('section', { class: 'card' },
      h('h2', null, 'Same claim, two platforms'),
      h('div', { class: 'pair' },
        h('div', null, h('h3', null, 'Bluesky post', d.handle ? h('span', { class: 'meta' }, ` · @${d.handle}`) : null), h('div', { class: 'embed-box' }, bq)),
        h('div', null, h('h3', null, 'X post the note was written for'), xBox)));
  }

  function noteCard(d, c) {
    if (!c) return null;
    const text = c.note ? decodeEntities(c.note.text) : '';
    const replyUrl = bskyUrlFromAt(d.reply_uri);
    return h('section', { class: 'card' },
      h('h2', null, 'The Community Note'),
      text ? h('p', { class: 'note-text' }, linkify(text))
           : h('p', { class: 'meta' }, `The note’s text isn’t available here${d.notes_error ? ` (${d.notes_error})` : ''}.`),
      h('p', { class: 'meta' },
        'Rated Helpful on X · ', ext(noteUrl(c.note_id), 'View the note on X'),
        replyUrl ? [' · ', ext(replyUrl, 'crossnote’s reply on Bluesky')] : null));
  }

  // Steps of the pipeline for one run. `d.stage` is where the run stopped:
  // length, tfidf, embedding or stage3 (labelled matches always reached stage3).
  function pipelineSteps(d, isEdit) {
    const stage = d.stage || 'stage3';
    const order = ['length', 'tfidf', 'embedding', 'stage3'];
    const reached = order.indexOf(stage);
    const status = (i) => (i < reached || (i === 3 && reached === 3)
      ? h('span', { class: 'pill ok' }, '✓ Passed')
      : i === reached ? h('span', { class: 'pill no' }, '✕ Stopped here')
      : h('span', { class: 'pill neutral' }, 'Not reached'));
    const t = d.thresholds || {};
    const cands = Array.isArray(d.candidates) ? d.candidates : [];
    const libNotes = d.library && d.library.notes;
    const libText = libNotes ? `any of the ${libNotes.toLocaleString()} notes in the library` : 'any note in the library';
    const chosen = cands.find((x) => String(x.note_id) === String(d.chosen_note_id));

    let outcome = null;
    if (isEdit) {
      outcome = chosen
        ? h('p', { class: 'outcome ok' }, `✓ This version would be labeled, using note #${chosen.rank}.`)
        : h('p', { class: 'outcome no' }, '✕ This version wouldn’t be labeled.');
    }
    return [
      outcome,
      h('div', { class: 'step' },
        h('h3', null, h('span', { class: 'n' }, '1'), 'Post filters', status(0)),
        h('p', null, isEdit ? 'Longer than two words.' : 'An original or quote post, in English or with no language tag, longer than two words.')),
      h('div', { class: 'step' },
        h('h3', null, h('span', { class: 'n' }, '2'), 'Word overlap (TF-IDF)', status(1)),
        h('p', null, `How many of the same words the post shares with ${libText}, weighted by how rare the words are.`),
        reached >= 1 ? meter('Highest TF-IDF similarity', d.scores && d.scores.tfidf_max, t.tfidf ?? CONFIG.TFIDF_THRESHOLD) : null),
      h('div', { class: 'step' },
        h('h3', null, h('span', { class: 'n' }, '3'), 'Meaning (embeddings)', status(2)),
        h('p', null, `How close the post is in meaning to ${libText}, using text-embedding-3-large.`),
        reached >= 2 ? meter('Highest embedding similarity', d.scores && d.scores.cosine_max, t.embedding ?? CONFIG.EMBEDDING_THRESHOLD) : null),
      h('div', { class: 'step' },
        h('h3', null, h('span', { class: 'n' }, '4'), `Top ${cands.length || t.top_k || CONFIG.TOP_K} notes and the model’s check`, reached === 3 ? null : status(3)),
        h('p', null, 'The most similar notes, in order, each judged by a language model: does this note apply to this post? The highest-ranked note it accepts is the one crossnote uses.'),
        cands.map((x) => {
          const isChosen = chosen && String(x.note_id) === String(chosen.note_id);
          const text = x.note ? decodeEntities(x.note.text) : '';
          return h('div', { class: 'cand' + (isChosen ? ' chosen' : '') },
            h('div', { class: 'top' },
              h('span', null, `#${x.rank}`),
              h('span', null, `similarity ${fmt3(x.cosine)}`),
              h('span', null, `TF-IDF ${fmt3(x.tfidf)}`),
              verdictPill(x),
              isChosen ? h('span', { class: 'pill shown' }, 'Used') : null),
            h('p', { class: 'excerpt' }, text ? truncate(text, 260) : h('span', { class: 'meta' }, `Note ${x.note_id}`)),
            x.reason ? h('p', { class: 'why' }, h('b', null, 'Model’s reason: '), x.reason) : null,
            h('p', { class: 'meta' }, ext(noteUrl(x.note_id), 'Note on X')));
        })),
    ];
  }

  function pipelineCard(d) {
    return h('section', { class: 'card' },
      h('h2', null, 'What the pipeline did'),
      pipelineSteps(d, false),
      d.library && d.library.name ? h('p', { class: 'meta' }, `Library snapshot ${d.library.name}${d.library.export_date ? `, from the Community Notes export of ${d.library.export_date}` : ''}.`) : null);
  }

  // Edit the post and run the pipeline again on the edited text (POST /demo/rerun).
  // Nothing is stored or labeled; the text goes to OpenAI for the embedding and model steps.
  function rerunCard(d) {
    const box = h('textarea', { id: 'rerun-text', class: 'rerun-text', maxlength: '1000', rows: '4',
      placeholder: 'Loading the post’s text…', disabled: true });
    const run = h('button', { class: 'btn primary', type: 'submit', disabled: true }, 'Run the pipeline');
    let original = '';
    const reset = h('button', { class: 'btn', type: 'button', disabled: true, onclick: () => { box.value = original; } }, 'Reset');
    const status = h('p', { class: 'meta', role: 'status', 'aria-live': 'polite' });
    const out = h('div', { class: 'rerun-out' });

    const ready = (text) => {
      original = text;
      box.value = text; box.disabled = false; box.placeholder = 'Type a version of the post…';
      run.disabled = false; reset.disabled = false;
    };
    if (EXAMPLE) {
      ready(d.example_post_text || '');
    } else {
      const u = new URL('https://public.api.bsky.app/xrpc/app.bsky.feed.getPosts');
      u.searchParams.set('uris', d.uri);
      getJson(u).then(({ ok, body }) => {
        const post = ok && body && body.posts && body.posts[0];
        ready((post && post.record && post.record.text) || '');
      }).catch(() => ready(''));
    }

    const form = h('form', {
      onsubmit: async (e) => {
        e.preventDefault();
        const text = box.value.trim();
        if (!text) { status.textContent = 'Type a version of the post first.'; return; }
        if (EXAMPLE) { status.textContent = 'Trying edits works on real posts only, not on the example.'; return; }
        run.disabled = true; out.replaceChildren();
        status.textContent = 'Running the pipeline… this can take up to 30 seconds.';
        try {
          const r = await fetch(`${CONFIG.API_BASE}/demo/rerun`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uri: d.uri, text }),
          });
          const body = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(body.message || `HTTP ${r.status}`);
          status.textContent = '';
          out.replaceChildren(h('div', null, h('h3', { class: 'rerun-title' }, 'What the pipeline does with your version'),
            pipelineSteps({ ...body, library: d.library && d.library.name === body.library ? d.library : { name: body.library } }, true)));
        } catch (err) {
          status.textContent = `Couldn’t run the pipeline: ${err.message}`;
        } finally {
          run.disabled = false;
        }
      },
    },
      h('label', { class: 'sr-only', for: 'rerun-text' }, 'Edited post text'),
      box,
      h('div', { class: 'choices' }, run, reset));

    return h('section', { class: 'card' },
      h('h2', null, 'Try a different version'),
      h('p', null, 'Edit the post and see what the pipeline would have done.'),
      form, status, out,
      h('p', { class: 'meta' }, 'Your text is sent to OpenAI to run the pipeline. It isn’t stored, and nothing is labeled. Up to 5 tries an hour.'));
  }

  function feedbackCard(d) {
    const key = `crossnote-feedback:${d.uri}`;
    const previous = store.get(key);
    const status = h('p', { class: 'meta', role: 'status', 'aria-live': 'polite' });
    if (previous) {
      return h('section', { class: 'card' },
        h('h2', null, 'Is this a good match?'),
        h('p', null, `Thanks. You answered “${{ yes: 'Yes', no: 'No', unsure: 'Not sure' }[previous] || previous}”.`));
    }
    let answer = null;
    const comment = h('textarea', { id: 'fb-comment', maxlength: '1000', placeholder: 'Optional: why? For example, “the post is criticising the claim, not making it”.' });
    const send = h('button', { class: 'btn primary', type: 'submit', disabled: true }, 'Send answer');
    const choice = (value, label) => h('button', {
      class: 'btn', type: 'button', 'aria-pressed': 'false',
      onclick: (e) => {
        answer = value; send.disabled = false;
        for (const b of e.currentTarget.parentNode.children) b.setAttribute('aria-pressed', String(b === e.currentTarget));
      },
    }, label);
    const form = h('form', {
      onsubmit: async (e) => {
        e.preventDefault();
        if (!answer) return;
        if (EXAMPLE) { status.textContent = 'This is example data, so the answer wasn’t sent.'; return; }
        send.disabled = true; status.textContent = 'Sending…';
        try {
          const r = await fetch(`${CONFIG.API_BASE}/demo/feedback`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uri: d.uri, answer, comment: comment.value.trim() || undefined }),
          });
          const body = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(body.message || `HTTP ${r.status}`);
          store.set(key, answer);
          form.replaceWith(h('p', null, 'Thanks, your answer was recorded. It helps us measure how often crossnote is right.'));
          status.textContent = '';
        } catch (err) {
          status.textContent = `Couldn’t send your answer: ${err.message}`;
          send.disabled = false;
        }
      },
    },
      h('div', { class: 'choices', role: 'group', 'aria-label': 'Does this note apply?' },
        choice('yes', 'Yes, it applies'), choice('no', 'No, wrong match'), choice('unsure', 'Not sure')),
      h('label', { class: 'sr-only', for: 'fb-comment' }, 'Comment'),
      comment,
      h('div', { style: 'margin-top:10px' }, send));
    return h('section', { class: 'card' },
      h('h2', null, 'Is this a good match?'),
      h('p', null, 'Does the Community Note correct a claim this Bluesky post actually makes?'),
      form, status,
      h('p', { class: 'meta' }, 'Your answer is stored with this post’s link and the note ID. We don’t store your IP address or account. If you wrote the post and want the label removed, ',
        ext(`${CONFIG.REPO_URL}/issues/new?template=wrong_label.yml`, 'report it'), '.'));
  }

  function resultView(d) {
    const c = (d.candidates || []).find((x) => String(x.note_id) === String(d.chosen_note_id)) || null;
    document.title = 'crossnote explorer · Matched post';
    render(
      header('Why crossnote labeled this post', 'crossnote matched this Bluesky post to a Community Note written on X for a post making the same claim.'),
      exampleNotice(),
      h('div', { class: 'notice' }, 'This is an automated match and may be wrong. The label is only shown to people who subscribe to ',
        ext(`https://bsky.app/profile/${CONFIG.LABELER_HANDLE}`, '@' + CONFIG.LABELER_HANDLE), '.'),
      sameClaimCard(d, c),
      noteCard(d, c),
      pipelineCard(d),
      rerunCard(d),
      feedbackCard(d),
      footer(h('a', { href: './' }, 'Look up another post')));
    embedBluesky();
    embedX(c);
  }

  function notFoundView(uri) {
    document.title = 'crossnote explorer · No label';
    render(
      header('crossnote hasn’t labeled this post', null),
      h('section', { class: 'card' },
        h('p', null, 'There’s no current crossnote label for ', ext(bskyUrlFromAt(uri) || '#', 'this post'), '. Most posts never get one. Some reasons:'),
        h('ul', null,
          h('li', null, 'crossnote only checks posts from accounts that follow ', ext(`https://bsky.app/profile/${CONFIG.LABELER_HANDLE}`, '@' + CONFIG.LABELER_HANDLE), ', and only posts made after they followed.'),
          h('li', null, 'The post didn’t make a claim that a recent Helpful Community Note corrects, or it was a reply.'),
          h('li', null, 'The label was removed, the post was deleted, or its author limits who can see their posts.'))),
      lookupCard(''),
      footer());
  }

  // ---- embeds ---------------------------------------------------------------
  async function embedBluesky() {
    if (EXAMPLE) return;
    try {
      await loadScript('https://embed.bsky.app/static/embed.js');
      setTimeout(() => { if (window.bluesky && typeof window.bluesky.scan === 'function') window.bluesky.scan(); }, 800);
    } catch { /* the link stays */ }
  }
  async function embedX(c) {
    const id = c && (c.tweet_id || (c.note && c.note.tweet_id));
    if (!id || EXAMPLE) return;
    try {
      await loadScript('https://platform.twitter.com/widgets.js');
      const box = document.getElementById('x-embed');
      const el = await window.twttr.widgets.createTweet(String(id), box, { conversation: 'none', dnt: true, theme: 'light' });
      const fb = box.querySelector('.fallback');
      if (el && fb) fb.remove();
    } catch { /* the link stays */ }
  }

  // ---- start ----------------------------------------------------------------
  async function main() {
    if (EXAMPLE) {
      try {
        const r = await getJson('example.json');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        resultView(r.body);
      } catch (e) {
        render(header('Example unavailable'), errorCard('Could not load the example.', String(e)));
      }
      return;
    }

    let uri = params.get('uri');
    // Older links: ?did=…&rkey=…, or ?post=<bsky.app link>.
    if (!uri && params.get('did') && params.get('rkey')) uri = `at://${params.get('did')}/app.bsky.feed.post/${params.get('rkey')}`;
    if (!uri && params.get('post')) {
      const p = parsePostInput(params.get('post'));
      if (p.error) return homeView(p.error);
      try { uri = `at://${await resolveActor(p.actor)}/app.bsky.feed.post/${p.rkey}`; }
      catch (e) { return homeView(e.message); }
      history.replaceState(null, '', postHref(uri));
    }
    if (!uri) return homeView();

    render(header('Looking up the post…'), h('p', { class: 'meta' }, 'Checking crossnote’s records.'));
    let r;
    try {
      r = await getJson(`${CONFIG.API_BASE}/demo/match?uri=${encodeURIComponent(uri)}`);
    } catch (e) {
      render(header('crossnote is unreachable'), errorCard('Couldn’t reach the crossnote server.', 'Please try again in a few minutes.'), footer());
      return;
    }
    if (r.status === 404) return notFoundView(uri);
    if (r.status === 400) return homeView('That doesn’t look like a Bluesky post link.');
    if (!r.ok || !r.body) {
      render(header('Something went wrong'), errorCard('Couldn’t load this post.', (r.body && r.body.message) || `HTTP ${r.status}`), footer());
      return;
    }
    resultView(r.body);
  }

  main();
})();
</script>
</body>
</html>
